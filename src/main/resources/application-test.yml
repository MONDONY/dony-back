spring:
  # H2 in-memory database for testing
  datasource:
    url: jdbc:h2:mem:dony_test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC

  # Flyway — run migrations on test database
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# Disable unnecessary services for tests
dony:
  kyc:
    enforce: false
  stripe:
    enforce: false
