<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta th:if="${status == 'success'}" http-equiv="refresh" th:content="'0;url=' + ${deepLink}">
  <title>Retour vers dony</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F4F6F8;
      color: #0D1B2A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #E9ECEF;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      margin: 20px;
      text-align: center;
    }
    .logo { font-size: 22px; font-weight: 800; color: #0B5FFF; letter-spacing: -0.5px; margin-bottom: 16px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 14px; color: #6B7A8D; margin-bottom: 20px; }
    a.button {
      display: inline-block;
      background: #0B5FFF;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">dony</div>
    <div th:if="${status == 'success'}">
      <h1>Paiement confirmé</h1>
      <p>Redirection vers l'app dony…</p>
    </div>
    <div th:unless="${status == 'success'}">
      <h1>Paiement non abouti</h1>
      <p>Le paiement a échoué ou a été annulé.</p>
    </div>
    <a class="button" th:href="${deepLink}">Retourner à dony</a>
  </div>
</body>
</html>
